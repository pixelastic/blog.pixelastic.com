version: 2.1

orbs:
  node: circleci/node@5

jobs:
  deploy:
    docker:
      - image: cimg/node:22.18
    steps:
      # System install
      - checkout
      - run:
          name: Install rsync
          command: sudo apt-get update && sudo apt-get install -y rsync
      - run:
          name: Configure pixelastic SSH remote
          command: |
            mkdir -p ~/.ssh
            echo "Host pixelastic" >> ~/.ssh/config
            echo "    HostName ${SSH_HOST}" >> ~/.ssh/config
            echo "    User ${SSH_USER}" >> ~/.ssh/config
            chmod 600 ~/.ssh/config
            ssh-keyscan -H ${SSH_HOST} >> ~/.ssh/known_hosts
      - add_ssh_keys:
          fingerprints:
            - "SHA256:gkwER8AtG6gCCUuge7eC08xkUCcjW38izxvaytl1X6I"

      # Project dependencies
      - node/install-packages:
          pkg-manager: yarn

      # Deploy
      - run:
          name: Deploy
          command: yarn deploy

workflows:
  version: 2
  deploy:
    jobs:
      - deploy:
          # Deploys are manual (`yarn run deploy`), never triggered by a push
          filters:
            branches:
              ignore: /.*/
